<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Simple website for calculating Dokkan unit stats" />
  <title>Dokkanalytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Orbitron:wght@500;700;900&display=block"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <main class="container">
    <div class="tabs">
      <div class="nav-actions">
        <div class="nav-btns-left">
          <a href="./razzers-guide" class="nav-btn" title="Razzer's Calcing Guide">
            <i data-lucide="book"></i>
          </a>
          <a href="./guide" class="nav-btn" title="General Guide">
            <i data-lucide="help-circle"></i>
          </a>
        </div>
        <button id="reset-btn" class="nav-btn reset-btn" title="Reset Calculator">
          <i data-lucide="rotate-ccw"></i>
        </button>
      </div>
      <button class="tab-btn active" data-tab="atk">ATK</button>
      <button class="tab-btn" data-tab="def">DEF</button>
    </div>


    <div class="info-section" style="text-align: center; margin-bottom: 2rem;">
      <div class="hipo-guide-module"
        style="display: inline-block; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; text-align: left; font-size: 0.85rem; min-width: 250px;">
        <div id="hipo-toggle"
          style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 1rem;">
          <strong style="color: var(--text-secondary);">HiPo Stats Guide</strong>
          <i id="hipo-icon" data-lucide="chevron-right" style="color: var(--text-secondary);"></i>
        </div>

        <div id="hipo-content"
          style="display: none; border-top: 1px solid rgba(255,255,255,0.1); padding: 1rem;">
          <div style="margin-bottom: 1rem;">
            <select id="hipo-percent-select"
              style="background: #18181b; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 0.2rem 0.5rem; border-radius: 4px; font-family: 'Outfit', sans-serif; cursor: pointer; width: 100%;">
              <option value="55">55%</option>
              <option value="69">69%</option>
              <option value="79">79%</option>
              <option value="90">90%</option>
              <option value="100" selected>100%</option>
            </select>
          </div>

          <div id="hipo-stats-display" style="line-height: 1.5;">

          </div>
        </div>
      </div>
    </div>


    <section id="atk-section" class="calculator-panel active-panel">
      <div class="inputs-grid">
        <div class="input-group">
          <label for="atk-base">Base ATK Stat</label>
          <input type="text" id="atk-base" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="atk-equip">Skill Orb Stats</label>
          <input type="text" id="atk-equip" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="atk-lead">Leader Skill (%)</label>
          <input type="text" id="atk-lead" value="440" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="atk-phase1">Phase 1 / SoT (%)</label>
          <input type="text" id="atk-phase1" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="atk-domain">Domain Effect (%)</label>
          <input type="text" id="atk-domain" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="atk-items">Support Items (%)</label>
          <input type="text" id="atk-items" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="atk-links">Link Skills (%)</label>
          <input type="text" id="atk-links" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="atk-active">Active Skills (%)</label>
          <input type="text" id="atk-active" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="atk-ki">Ki Multiplier (%)</label>
          <input type="text" id="atk-ki" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="atk-phase2">Phase 2 / Mid-battle (%)</label>
          <input type="text" id="atk-phase2" min="0" step="1">
        </div>


        <div class="sa-config-grid">

          <div class="input-group" style="position: absolute; top: 1rem; right: 1.5rem; justify-content: center; flex-direction: row; gap: 1rem;">
            <label class="custom-checkbox-label" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" id="sa-eza" class="custom-checkbox">
              <span class="checkmark"></span>
              EZA'd
            </label>
            <label class="custom-checkbox-label" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" id="sa-manual" class="custom-checkbox">
              <span class="checkmark"></span>
              Manual
            </label>
          </div>

          <div class="sa-row">
            <div class="input-group">
              <label for="sa-rarity">Rarity</label>
              <select id="sa-rarity">
                <option value="tur">TUR</option>
                <option value="lr" selected>LR</option>
              </select>
            </div>

            <div class="input-group">
              <label for="sa-type" id="sa-type-label">SA Type</label>
              <select id="sa-type">
                <option value="colossal">Colossal</option>
                <option value="mega-colossal" selected>Mega-Colossal</option>
                <option value="ultimate">Ultimate</option>
                <option value="finish">Finish</option>
              </select>
              <input type="text" id="sa-manual-mult" style="display: none;">
            </div>
            
            <div class="input-group" id="charge-count-group" style="position: absolute; visibility: hidden; opacity: 0; pointer-events: none;">
              <label for="atk-charge-count">Finish Multiplier</label>
              <input type="text" id="atk-charge-count" min="0" step="1">
              <span class="tooltip">Base Multiplier of the Finish/Active + Charge Counts for Standby</span>
            </div>
          </div>

          <div class="sa-row">
            <div class="input-group">
              <label for="atk-hp-boost">HiPo SA Boost</label>
              <input type="text" id="atk-hp-boost" value="15" min="0" max="30" step="1">
              <span class="tooltip">Level of SA Boost Node (+5% per level)</span>
            </div>

            <div class="input-group">
              <label for="atk-sa-effects">SA Effects (%)</label>
              <input type="text" id="atk-sa-effects" min="0" step="1">
            </div>
          </div>

        </div>
      </div>

      <div class="result-board">
        <h3>
          Total ATK
          <button id="atk-copy" class="copy-btn" title="Copy Raw Value" aria-label="Copy Raw Value">
            <i data-lucide="clipboard"></i>
          </button>
        </h3>
        <div class="result-value" id="atk-result">0</div>
        <div class="calculation-steps" id="atk-steps"></div>
      </div>
    </section>


    <section id="def-section" class="calculator-panel">
      <div class="inputs-grid">
        <div class="input-group">
          <label for="def-base">Base DEF Stat</label>
          <input type="text" id="def-base" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="def-equip">Skill Orb Stats</label>
          <input type="text" id="def-equip" min="0" step="1">
          <span class="tooltip">Additional raw stats added to Base</span>
        </div>

        <div class="input-group">
          <label for="def-lead">Leader Skill (%)</label>
          <input type="text" id="def-lead" value="440" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="def-phase1">Phase 1 / SoT (%)</label>
          <input type="text" id="def-phase1" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="def-domain">Domain Effect (%)</label>
          <input type="text" id="def-domain" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="def-items">Support Items (%)</label>
          <input type="text" id="def-items" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="def-links">Link Skills (%)</label>
          <input type="text" id="def-links" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="def-active">Active Skills (%)</label>
          <input type="text" id="def-active" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="def-phase2">Phase 2 / Mid-battle (%)</label>
          <input type="text" id="def-phase2" min="0" step="1">
        </div>

        <div class="input-group">
          <label for="def-sa">SA Effects (%)</label>
          <input type="text" id="def-sa" min="0" step="1">
          <span class="tooltip">Buffs gained specifically from SA</span>
        </div>
      </div>

      <div class="result-board">
        <h3>
          Total DEF
          <button id="def-copy" class="copy-btn" title="Copy Raw Value" aria-label="Copy Raw Value">
            <i data-lucide="clipboard"></i>
          </button>
        </h3>
        <div class="result-value" id="def-result">0</div>
        <div class="calculation-steps" id="def-steps"></div>
      </div>
    </section>

  </main>
  <script src="script.js"></script>
</body>

</html>
